name: Rust Companion v2 CI
on:
  push:
    branches: [test-live-sync]
    paths: ["v2/**", "tests/test_v2_*.py", ".github/workflows/v2-ci.yml"]
  pull_request:
    paths: ["v2/**", "tests/test_v2_*.py", ".github/workflows/v2-ci.yml"]
jobs:
  validate:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - uses: dtolnay/rust-toolchain@stable
        with: { components: rustfmt }
      - run: cargo fmt --manifest-path v2/Cargo.toml --all -- --check
      - run: cargo test --manifest-path v2/Cargo.toml --workspace --locked
      - uses: actions/setup-node@v4
        with: { node-version: "22", cache: npm, cache-dependency-path: v2/apps/desktop/package-lock.json }
      - working-directory: v2/apps/desktop
        run: npm ci
      - working-directory: v2/apps/desktop
        run: npm test
      - working-directory: v2/apps/desktop
        run: npm run build
